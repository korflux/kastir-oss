name: Quality

on:
  pull_request:
    branches:
      - main
      - homolog
  push:
    branches:
      - main
      - homolog

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      # Immutable action commits keep the merge gate reproducible.
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gera o client consumido pelas suítes de integração antes do Vitest importar os módulos.
      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          # O Prisma 7 exige a variável ao ler a config, mas generate não abre conexão.
          DATABASE_URL: postgresql://build-placeholder:build-placeholder@127.0.0.1:1/kastir

      - name: Validate
        run: pnpm validate
        env:
          # Testes importam o schema de ambiente; placeholders mantêm o gate hermético e sem secrets.
          AUTH_TRUST_PROXY: "false"
          BETTER_AUTH_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://build-placeholder:build-placeholder@127.0.0.1:1/kastir
          MASTER_EMAIL: build@example.invalid
          MASTER_FORCE_RESET: "false"
          MASTER_PASSWORD: build-placeholder
          MCP_INTROSPECTION_CLIENT_ID: ""
          MCP_INTROSPECTION_CLIENT_SECRET: ""
          NEXTAUTH_SECRET: build-only-placeholder-with-at-least-32-characters
          NEXT_TELEMETRY_DISABLED: "1"
          REDIS_URL: redis://:build-placeholder@127.0.0.1:1

      - name: Check formatting
        run: pnpm format:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Detect secrets in the changed range
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ZERO_SHA: 0000000000000000000000000000000000000000
        run: |
          set -euo pipefail

          # Pushes use the event's previous commit; a first push scans its root commit.
          if [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            RANGE="$HEAD_SHA"
          else
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          fi

          git cat-file -e "${HEAD_SHA}^{commit}"
          if [ "$BASE_SHA" != "$ZERO_SHA" ]; then
            git cat-file -e "${BASE_SHA}^{commit}"
          fi

          # The digest pins gitleaks v8.29.1; the read-only mount prevents mutations.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a \
            git --redact --no-banner --exit-code 1 --log-opts="$RANGE"
