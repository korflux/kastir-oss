worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Declares charset=utf-8 on text/html responses that don't already set one
  # (published pages served from disk); doesn't override /llms.txt's own
  # charset or any charset the Next.js upstream already sends.
  charset utf-8;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  # Align with media upload limits (see docs/DEPLOY.md).
  client_max_body_size 210m;

  upstream kastir_next {
    server 127.0.0.1:3000;
  }

  server {
    listen 80;
    server_name _;
    root /app/public;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Authentication rate limits trust these only when AUTH_TRUST_PROXY=true.
    # Overwrite both values so public clients cannot inject a forged address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Publicado: nosniff + referrer. Locations com add_header próprio
    # precisam repetir (nginx não herda). Sem XFO/HSTS — o site pode ser embebido.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Dynamic panel + APIs only (never serve as static from public/).
    location = /admin {
      proxy_pass http://kastir_next;
    }

    location ^~ /admin/ {
      proxy_pass http://kastir_next;
    }

    location = /api {
      proxy_pass http://kastir_next;
    }

    location ^~ /api/ {
      proxy_pass http://kastir_next;
    }

    # Split Test public redirects (dynamic — never serve as static HTML).
    location ^~ /s/ {
      proxy_pass http://kastir_next;
    }

    # Private draft preview (auth inside Next — never serve as static HTML).
    location ^~ /p/ {
      proxy_pass http://kastir_next;
    }

    location ^~ /_next/ {
      proxy_pass http://kastir_next;
    }

    # WebP do favicon passa pelo adaptador Next (metadata estática não suporta
    # WebP nesta versão), sem depender de uma cópia em public/.
    location = /icon.webp {
      proxy_pass http://kastir_next;
    }

    location ^~ /_next/static/ {
      proxy_pass http://kastir_next;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
    }

    # OAuth discovery metadata must reach Next instead of public/ files.
    location ^~ /.well-known/ {
      proxy_pass http://kastir_next;
    }

    location = /_kastir/admin-bar.js {
      add_header Cache-Control "public, max-age=3600";
      add_header X-Kastir-Served-By nginx-public always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      try_files $uri =404;
    }

    # Local site backups — never public (phase 22).
    location ^~ /_kastir/backups/ {
      deny all;
      return 404;
    }

    location = /index.html {
      return 301 /$is_args$args;
    }

    # Published site: disk only, except the root installation fallback.
    # X-Kastir-Served-By is a smoke/debug header (low sensitivity).
    location = /robots.txt {
      add_header X-Kastir-Served-By nginx-public always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      try_files $uri =404;
    }

    location = /sitemap.xml {
      add_header X-Kastir-Served-By nginx-public always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      try_files $uri =404;
    }

    location = /llms.txt {
      add_header X-Kastir-Served-By nginx-public always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      default_type text/plain;
      charset utf-8;
      try_files $uri =404;
    }

    location ^~ /uploads/ {
      add_header Cache-Control "public, max-age=3600";
      add_header X-Kastir-Served-By nginx-public always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      try_files $uri =404;
    }

    # Keep old published links working while making the clean slug canonical.
    location ~ ^/([^/]+)/index\.html$ {
      return 301 /$1$is_args$args;
    }

    location = / {
      add_header Cache-Control "public, max-age=300, must-revalidate";
      add_header X-Kastir-Served-By nginx-public always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      try_files /index.html @nextjs;
    }

    location @nextjs {
      proxy_pass http://kastir_next;
    }

    location / {
      add_header Cache-Control "public, max-age=300, must-revalidate";
      add_header X-Kastir-Served-By nginx-public always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      try_files $uri $uri/index.html @notfound;
    }

    location @notfound {
      if (-f $document_root/.notfound-redirect) {
        return 302 /;
      }
      # try_files serving 404.html directly would answer 200 (it just found a
      # file) — route through error_page so the response keeps HTTP 404 while
      # still returning the custom body when one exists.
      error_page 404 /404.html;
      return 404;
    }

    location = /404.html {
      internal;
      try_files /404.html =404;
    }
  }
}
